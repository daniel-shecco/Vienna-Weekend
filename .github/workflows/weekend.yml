name: Publish weekend guide

# Builds the page from data/events.json and publishes it to GitHub Pages.
# The data is researched and pushed every Friday by a Claude Code routine
# (see ROUTINE.md). No API keys or paid calls are used here.
on:
  push:
    branches: [main]
    paths: [data/events.json]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node src/build.mjs data/events.json --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
